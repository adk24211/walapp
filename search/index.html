    <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>

    <input type="search" id="search-input" placeholder="제도명·기관·키워드 (예: 청년 월세, 장학금, 고용노동부)"
           autocomplete="off" autofocus aria-label="검색어 입력">
  </div>

  <p class="search-status" id="search-status">검색어를 입력하면 결과가 표시됩니다.</p>

  <div class="cards" id="search-results"></div>
</div>

<script>
(function () {
  var SEARCH_URL = "/walapp/search.json";
  var input   = document.getElementById('search-input');
  var status  = document.getElementById('search-status');
  var results = document.getElementById('search-results');
  // 분야 라벨은 _data/taxonomy.json 에서 그대로 가져온다 (템플릿에 한글 라벨 하드코딩 금지).
  var CAT_LABEL = {
    
    "housing": "주거",
    
    "jobs": "일자리·창업",
    
    "care": "양육·돌봄",
    
    "health": "건강·의료",
    
    "education": "교육·역량",
    
    "finance": "금융·자산",
    
    "living": "생활·문화"
    
  };
  var docs = [];
  var ready = false;

  fetch(SEARCH_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      docs = data;
      ready = true;
      if (input.value.trim()) run(input.value);
    })
    .catch(function () {
      status.textContent = '검색 인덱스를 불러오지 못했습니다.';
    });

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function highlight(text, terms) {
    var out = escapeHtml(text);
    terms.forEach(function (t) {
      if (!t) return;
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = out.replace(re, '<mark>$1</mark>');
    });
    return out;
  }

  function run(query) {
    var q = query.trim();
    if (!q) { results.innerHTML = ''; status.textContent = '검색어를 입력하면 결과가 표시됩니다.'; return; }
    if (!ready) { status.textContent = '검색 인덱스를 불러오는 중…'; return; }

    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var matched = docs.filter(function (d) {
      var hay = (d.title + ' ' + d.summary + ' ' + d.content + ' ' + (d.tags || []).join(' ')).toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) !== -1; });
    });

    if (matched.length === 0) {
      results.innerHTML = '';
      status.textContent = '"' + q + '"에 대한 검색 결과가 없습니다.';
      return;
    }

    status.textContent = '"' + q + '" 검색 결과 ' + matched.length + '건';
    results.innerHTML = matched.map(function (d) { return card(d, terms); }).join('');
  }

  // 결과 카드 — _includes/program-card.html 과 같은 마크업을 만든다.
  //
  // 예전에는 여기만 옛 카드(.card-inner/.card-accent/'자세히 보기')를 쓰고
  // 있었다. 그 장치들은 사이트 다른 곳에서 이미 걷어낸 것이라, 같은 제도가
  // 홈에서는 '시행중 · 250만원 · 고용노동부' 로, 검색에서는 본문 발췌로
  // 보였다. 고를 때 필요한 값이 검색에만 없었던 셈이다.
  //
  // ⚠️ 이 함수를 고칠 때는 program-card.html 도 함께 본다. 한쪽만 바꾸면
  //    같은 카드가 두 모양이 된다. 값은 search.json 이 실어 준다.
  function card(d, terms) {
    var cls = 'post-card cn pcard';
    if (d.status === 'closed') cls += ' is-closed';
    if (d.status === 'upcoming') cls += ' is-upcoming';

    // ① 상태
    var state;
    if (d.status === 'closed') {
      state = '<span class="is-closed">접수 종료' + (d.apply_end ? ' · ' + escapeHtml(d.apply_end) : '') + '</span>';
    } else if (d.status === 'upcoming') {
      state = '<span class="is-upcoming">' + (d.apply_start ? escapeHtml(d.apply_start) + ' 시작' : '시작 예정') + '</span>';
    } else {
      state = '<span class="is-active">시행중</span>';
    }

    // ④ 기관 · 기간 · 분야 · 지역
    var meta = '';
    if (d.org) meta += '<span>' + highlight(d.org, terms) + '</span>';
    if (d.apply_always) meta += '<span>상시 접수</span>';
    else if (d.status === 'upcoming' && d.apply_start) meta += '<span>' + escapeHtml(d.apply_start) + ' ~ ' + escapeHtml(d.apply_end || '') + '</span>';
    else if (d.apply_end) meta += '<span>~ ' + escapeHtml(d.apply_end) + '</span>';
    meta += '<span class="pcard-cat">' + escapeHtml(CAT_LABEL[d.category] || d.category) + '</span>';
    if (d.region && d.region !== '전국') meta += '<span>' + escapeHtml(d.region) + '</span>';

    return '' +
      '<a href="' + d.url + '" class="' + cls + '" data-cat="' + escapeHtml(d.category) + '">' +
        '<div class="pcard-body">' +
          '<p class="pcard-status">' + state + '</p>' +
          '<h2 class="pcard-title">' + highlight(d.title, terms) + '</h2>' +
          (d.highlight ? '<p class="pcard-amount">' + escapeHtml(d.highlight) + '</p>' : '') +
          '<p class="pcard-meta">' + meta + '</p>' +
        '</div>' +
      '</a>';
  }

  var timer;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { run(input.value); }, 150);
  });

  // ?q= 쿼리스트링 지원
  //
  // 값만 채우고 run() 을 부르지 않아서, 링크를 타고 온 사람은 검색어가 입력창에
  // 적혀 있는데 결과가 비어 있는 화면을 봤다. 한 글자 더 쳐야 결과가 나왔다.
  // 404 화면의 검색 폼이 여기로 넘기므로 반드시 바로 실행해야 한다.
  var params = new URLSearchParams(window.location.search);
  var initial = params.get('q');
  if (initial) {
    input.value = initial;
    run(initial);
  }
})();
</script>
