name: Daily Post Generator

on:
  schedule:
    # 매일 KST 07:00 = UTC 22:00 (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "포스팅 날짜 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (파일 저장 없이 테스트)"
        required: false
        type: boolean
        default: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scripts/run_all.py

      - name: Commit new posts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          if git diff --staged --quiet; then
            echo "새 포스트 없음 — 커밋 스킵"
          else
            git commit -m "📰 Daily brief: $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Setup Ruby for Jekyll build check
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll (검증용)
        run: bundle exec jekyll build --destination _site_check
        env:
          JEKYLL_ENV: production

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_check
          publish_branch: gh-pages
