name: Daily Program Sync

# 구 "Daily Post Generator" 를 대체한다.
# 차이: 매일 4개를 강제 발행하지 않는다. 큐가 비면 아무것도 쓰지 않고 넘어간다.
# 억지 생성이 중복의 직접 원인이었다. (REDESIGN.md §1.2)
#
# 하루 작업량:
#   · 시행중  오늘 조의 테마 4개마다 1건씩 = 4건 (테마 8개를 격일로 교대)
#   · 예정    상위 1건. 후보가 없으면 0건 — 억지로 채우지 않는다.
#   · 상태갱신 마감일이 지난 제도 전량. 저장해 둔 해설을 재사용하므로 LLM 을 쓰지 않는다.
# 순서는 원천 조회수(보조금24 `조회수` / 복지로 `inqNum`)로 정한다.

on:
  schedule:
    # 매일 KST 07:00 = UTC 22:00 (전날)
    #
    # 이 크론은 신규 발행만을 위한 것이 아니다. 상태 갱신(시행중 → 종료,
    # 예정 → 시행중)이 이 실행에 실려 있으므로, 며칠 건너뛰면 마감된 제도가
    # '시행중' 으로 남는다. 끄지 말 것.
    #
    # Secrets 에 DATA_GO_KR_API_KEY 가 없으면 아래 가드 스텝이 워크플로우를
    # 중단시킨다 (목 데이터 배포 방지). 키를 지우면 매일 실패 알림이 온다.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (sync: 평소 동기화 / regenerate: 표적 재생성)"
        required: false
        type: choice
        options: ["sync", "regenerate"]
        default: "sync"
      regenerate_limit:
        description: "표적 재생성 상한 (regenerate 모드에서만)"
        required: false
        default: "40"
      post_date:
        description: "기준 날짜 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""
      publish_mode:
        description: "발행 방식 (theme: 테마 조별 / top: 상위 N건 일괄 — 초기 백필용)"
        required: false
        type: choice
        options: ["theme", "top"]
        default: "theme"
      per_theme_limit:
        description: "테마당 발행 건수 (theme 방식)"
        required: false
        default: "5"
      upcoming_limit:
        description: "시행 예정 발행 건수 (후보 없으면 0건)"
        required: false
        default: "1"
      publish_limit:
        description: "발행 상한 (top 방식에서만 사용)"
        required: false
        default: "5"
      refresh_limit:
        description: "갱신 상한"
        required: false
        default: "10"
      region_scope:
        description: "발행 범위 (중앙부처만: national / 지자체 포함: national,sido,sigungu)"
        required: false
        default: "national"
      dry_run:
        description: "Dry run (파일 저장 없이 테스트)"
        required: false
        type: boolean
        default: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 실 API 키 없이 스케줄 실행되면 목 데이터가 배포된다.
      # 지원금 정보는 YMYL 영역이라 가짜 수치가 공개되면 실제 피해로 이어지므로 여기서 막는다.
      - name: Guard against mock data deployment
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error::DATA_GO_KR_API_KEY 가 설정되지 않았습니다."
            echo "이 키가 없으면 파이프라인이 목(mock) 데이터로 동작하며, 가짜 지원금 정보가 배포됩니다."
            echo "공공데이터포털에서 활용신청 후 Secrets 에 등록하세요. (REDESIGN.md 단계 0)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: ${{ github.event.inputs.mode != 'regenerate' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 해설 생성 모델. 제공처가 모델을 내리면 여기만 바꿔 복구한다.
          # 비워 두면 generate_program.PRIMARY_MODEL 의 기본값을 쓴다.
          # (변수는 저장소 Settings > Secrets and variables > Variables 에 둔다)
          WALAPP_LLM_MODEL: ${{ vars.WALAPP_LLM_MODEL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          MOCK_DATA: "0"
          POST_DATE: ${{ github.event.inputs.post_date }}
          PUBLISH_MODE: ${{ github.event.inputs.publish_mode || 'theme' }}
          PER_THEME_LIMIT: ${{ github.event.inputs.per_theme_limit || '5' }}
          UPCOMING_LIMIT: ${{ github.event.inputs.upcoming_limit || '1' }}
          PUBLISH_LIMIT: ${{ github.event.inputs.publish_limit || '5' }}
          REFRESH_LIMIT: ${{ github.event.inputs.refresh_limit || '10' }}
          # 중앙부처 우선 (REDESIGN.md §11 확정). 지자체로 넓힐 때 값을 바꾼다.
          REGION_SCOPE: ${{ github.event.inputs.region_scope || 'national' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          TZ: Asia/Seoul
        run: python scripts/run_all.py

      # ── 표적 재생성 (수동 실행 전용) ──
      #
      # 동기화는 **원문이 바뀐** 제도만 다시 쓴다. 그래서 프롬프트를 고쳐도
      # 이미 발행된 페이지는 그대로 남는다. 이 스텝이 그 간극을 메운다.
      # 원문은 넉넉한데 우리 문장이 얇은 것만 골라 조회수 순으로 다시 쓴다.
      #
      # 새 제도를 수집하지 않으므로 이날은 신규 발행이 없다. 토큰 한도를
      # 재생성에 쓰는 것이라, 돌릴지 말지는 사람이 정한다(그래서 수동 전용).
      # 미리보기. dry_run 여부와 무관하게 무엇이 대상인지 로그에 남긴다.
      # ⚠️ 실제 실행과 **같은 --limit** 을 줘야 한다. 안 그러면 미리보기는
      #    기본값 40건을 찍는데 실제로는 100건을 돌리는 식으로 어긋난다.
      - name: Preview targeted regeneration
        if: ${{ github.event.inputs.mode == 'regenerate' }}
        env:
          REGEN_LIMIT: ${{ github.event.inputs.regenerate_limit || '40' }}
          TZ: Asia/Seoul
        run: python scripts/regenerate.py --dry-run --limit "$REGEN_LIMIT"

      # ⚠️ dry_run 이면 여기서 멈춘다. regenerate.py 는 --dry-run 이 아니면
      #    실제로 모델을 부르므로, dry_run 을 무시하면 하루 토큰을 다 태우고
      #    결과는 커밋되지 않아 그대로 버려진다.
      #
      # ⚠️ 입력값을 run 문자열에 직접 보간하지 않는다. 이 잡은 contents:write 와
      #    GROQ_API_KEY·DATA_GO_KR_API_KEY 를 들고 있어서, 자유입력이 셸에
      #    그대로 들어가면 임의 명령 실행 통로가 된다. env 로 받아 인용한다.
      - name: Run targeted regeneration
        if: ${{ github.event.inputs.mode == 'regenerate' && github.event.inputs.dry_run != 'true' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WALAPP_LLM_MODEL: ${{ vars.WALAPP_LLM_MODEL }}
          REGEN_LIMIT: ${{ github.event.inputs.regenerate_limit || '40' }}
          TZ: Asia/Seoul
        run: python scripts/regenerate.py --limit "$REGEN_LIMIT"

      # 이미 저장돼 있던 http:// 신청 링크를 https 로 올린다.
      # 새로 들어오는 레코드는 수집 단계가 알아서 올리므로(collect/url_https.py)
      # 이 단계는 그 전에 쌓인 것들을 위한 것이다. 올릴 게 없으면 즉시 끝난다.
      # 실패해도 동기화를 세우지 않는다 — 링크가 http 로 남을 뿐이고,
      # 그것 때문에 그날 발행을 통째로 버릴 이유는 없다.
      - name: Upgrade stored http links to https
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TZ: Asia/Seoul
        run: python scripts/upgrade_urls.py

      - name: Commit new and updated programs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TZ: Asia/Seoul
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _programs/ _records/ _data/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 스킵"
          else
            NEW=$(git diff --staged --name-only --diff-filter=A -- _programs/ | wc -l)
            MOD=$(git diff --staged --name-only --diff-filter=M -- _programs/ | wc -l)
            if [ "${{ github.event.inputs.mode }}" = "regenerate" ]; then
              git commit -m "♻️ 표적 재생성 $(date +'%Y-%m-%d') — ${MOD}건 다시 씀"
            else
              git commit -m "📋 제도 동기화 $(date +'%Y-%m-%d') — 신규 ${NEW} · 갱신 ${MOD}"
            fi
            git push
          fi

      - name: Setup Ruby for Jekyll build
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll
        run: bundle exec jekyll build --destination _site_check --future
        env:
          JEKYLL_ENV: production
          TZ: Asia/Seoul

      # 빌드는 통과하는데 인라인 <script> 가 죽어 있을 수 있다. 실제로 검색
      # 페이지가 그렇게 배포된 적이 있다 — 화면은 멀쩡하고 검색만 안 됐다.
      # 실행하지 않고 컴파일만 하므로 브라우저가 필요 없고 몇 초면 끝난다.
      - name: Check inline scripts
        run: node scripts/check_inline_js.mjs _site_check

      # 검색엔진에 자기를 뭐라고 소개하는지. 화면은 멀쩡한데 조용히 틀리는
      # 부류라 기계가 본다 — 실제로 201개 페이지의 meta description 이 전부
      # 본문 조각이었고, 제도 페이지가 자기를 블로그 글이라고 말하고 있었다.
      - name: Check search metadata
        run: node scripts/check_seo.mjs _site_check

      # 지어낸 자격 요건이 검증을 빠져나가지 않는지. 항목 수 상한을 올린 뒤
      # 실제로 그 구멍이 있었다 — 원문 근거 없는 자격 9개가 전량 통과했다.
      - name: Check fact verification
        run: python scripts/check_verify.py

      - name: Deploy to GitHub Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site_check
          publish_branch: gh-pages
