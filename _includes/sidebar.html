<div class="sidebar-widget">
  <h3 class="widget-title">이번 주 인기글</h3>
  <ol class="hot-list">
    {% assign recent = site.posts | limit: 5 %}
    {% for post in recent %}
    <li class="hot-item">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ol>
</div>

<div class="sidebar-widget">
  <h3 class="widget-title">카테고리</h3>
  <ul class="cat-list">
    <li><a href="{{ '/category/policy/' | relative_url }}">🏛 국내 정책</a></li>
    <li><a href="{{ '/category/youth/' | relative_url }}">🧑‍🎓 청년 정책</a></li>
    <li><a href="{{ '/category/data/' | relative_url }}">📊 통계·생활정보</a></li>
    <li><a href="{{ '/category/curious/' | relative_url }}">✨ 흥미로운 발견</a></li>
  </ul>
</div>

<div class="sidebar-widget sidebar-subscribe">
  <h3 class="widget-title">📬 구독하기</h3>
  <p>새 글이 올라오면 이메일로 알려드려요.</p>
  <a href="{{ '/feed.xml' | relative_url }}" class="rss-btn">RSS 구독</a>
</div>
