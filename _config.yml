title: Walapp
description: 정부·지자체 지원금과 복지 제도를 받을 수 있는지부터 신청 방법까지 하나씩 정리합니다. 공공데이터 원문을 토대로 쉬운 말로 풀어 씁니다.
baseurl: "/walapp"
url: "https://adk24211.github.io"
lang: ko

# ---- 제도 컬렉션 ----
# 발행 단위가 '날짜'가 아니라 '제도'다. _posts 와 달리 파일명에 날짜가 강제되지 않으므로
# 같은 제도는 항상 같은 경로에 쓰인다 → 재수집이 새 글이 아니라 갱신이 된다.
collections:
  programs:
    output: true
    permalink: /support/:path/

# ---- 발행 시점 ----
# 당일 07시(KST) 포스트가 빌드 시점에 '미래'로 간주돼 누락되는 것을 방지한다.
# (날짜 표시는 워크플로우 빌드 스텝의 TZ=Asia/Seoul 로 KST로 렌더된다)
future: true

# ---- SEO / 소셜 ----
author: Walapp
twitter:
  card: summary_large_image
social:
  name: Walapp
  links: []
logo: /assets/images/logo.png
image: /assets/images/logo-full.png

# 모든 페이지 기본 공유 이미지(og:image/twitter:image) — jekyll-seo-tag가 page.image로 사용
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logo-full.png
  - scope:
      path: ""
      type: programs
    values:
      layout: program

# Google Search Console 사이트 소유 인증 (HTML 태그 방식의 content 값).
google_site_verification: "5IRKXouoxlQsJLyugZIoOCw7sXlWB-mYV9Trnlm88a4"

# Google Analytics(GA4) 측정 ID. 값을 넣으면 추적 스크립트 자동 삽입.
google_analytics: "G-NS58PGSBFP"

# Google AdSense 게시자 ID (예: "ca-pub-1234567890123456").
# 값을 넣으면 자동 광고(Auto ads) 스크립트와 ads.txt 가 자동 적용된다.
google_adsense: "ca-pub-4499851283666675"

# 자동 광고 on/off. **false 면 게시자 ID 가 있어도 광고 스크립트를 넣지 않는다.**
#
# 2026-08-18 에 껐던 이유: 크롬이 목록 화면에 '위험한 사이트'(소셜 엔지니어링)
# 인터스티셜을 띄웠다. 구글의 소셜 엔지니어링 정책은 '제3자 광고가 사이트
# 콘텐츠인 것처럼 보이는 경우' 를 명시적으로 위반으로 본다 — 자동 광고의
# 앵커·전면(vignette) 포맷이 모바일에서 딱 그렇게 보인다.
#
# 2026-08-19 재심사 통과로 다시 켠다. AdSense 검토를 받으려면 광고 코드가
# 페이지에 있어야 하므로 켜는 것 자체는 피할 수 없다.
#
# ⚠️ 다시 걸리지 않으려면 이 플래그만으로는 부족하다. **AdSense 콘솔에서
#    앵커 광고와 전면(vignette) 광고를 꺼 둘 것.** 여기서 켜는 것은 자동 광고
#    스크립트 한 줄이고, 어떤 포맷을 띄울지는 콘솔이 정한다. 한 번 걸렸던
#    사이트에 같은 포맷을 되돌려 놓을 이유가 없다.
#
#    콘솔: 광고 > 사이트별 > adk24211.github.io > 수정 > 광고 형식
ads_enabled: true

# ── 얇은 제도 페이지에는 광고를 넣지 않는다 ──
#
# 애드센스가 "가치가 별로 없는 콘텐츠" 로 반려한 뒤 만든 스위치다.
# 제도 페이지의 front matter 에 있는 own_chars(원문 위에 우리가 얹은 글자 수,
# scripts/render.py 가 계산)가 이 값 미만이면 그 페이지에만 광고 코드를
# 넣지 않는다. 제도 페이지에만 걸리며 홈·허브·검색에는 영향이 없다.
#
# 왜 noindex 가 아니라 이것인가: noindex 는 검색 색인 지시이지 광고 심사 범위를
# 좁히는 수단이 아니다. 심사는 사이트 단위로 이뤄지고, 광고 코드가 붙은
# 페이지는 색인 여부와 무관하게 대상이 된다. 심사에서 확실히 빼는 방법은
# 페이지를 빌드에서 지우거나 그 페이지에만 광고를 안 넣는 것 둘뿐이다.
#
# ⚠️ 글자 수만으로 자르지 말 것. 두 조건을 **함께** 봐야 한다.
#
#    처음엔 글자 수 하나만 두려 했는데, 조회수와 나란히 놓고 재 보니 반대였다.
#    사이트에서 두 번째로 얇은 페이지가 장기전세 주택공급(236자)인데 조회수가
#    669,273 이다. 노후준비서비스(276자·547,637), 전세보증금반환보증 보증료
#    지원(383자·703,733)도 같다. 글자 수만으로 자르면 **사람들이 가장 많이
#    찾는 페이지부터** 사라진다. 그건 덜어낼 것이 아니라 채울 것이다.
#
#    그래서 '얇고 **동시에** 거의 안 보는' 것만 뺀다. 둘 중 하나만 해당하면
#    광고를 그대로 둔다.
#
# 지금 값(400자 / 10,000회)을 고른 근거 — 365건 기준:
#
#     기준              제외        광고 남는 쪽 중앙값   제외분의 조회 지분
#     300자/10,000     31건( 8%)        440자              0.4%
#     400자/ 5,000     55건(15%)        456자              0.4%
#     400자/10,000     87건(23%)        474자              1.3%   ← 이것
#     400자/20,000    112건(30%)        488자              2.5%
#     500자/10,000    128건(35%)        490자              1.9%
#
#    87건을 빼면 광고가 실리는 페이지의 자체 문장 중앙값이 428 → 474자로
#    오르는데, 그 87건이 차지하는 조회 지분은 1.3% 다. 20,000회로 올리면
#    30%를 빼고도 중앙값은 488자에 그친다 — 얻는 것에 비해 많이 잘린다.
#
# 둘 다 0 이면 아무것도 걸리지 않는다.
# 값을 바꾸기 전에 `python3 scripts/report_thin.py` 로 다시 잴 것.
ads_min_own_chars: 400
ads_min_view_count: 10000

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - scripts/
  - requirements.txt
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  - REDESIGN.md
  - docs/

# RSS 는 feed.xml 을 직접 쓴다 (이유는 그 파일 주석 참고). jekyll-feed 는 끈다.

# 카카오톡 공유용 JavaScript 키.
# 비워 두면 제도 페이지의 '카카오톡' 버튼은 OS 공유 시트를 띄우고,
# 그것도 없으면 링크를 복사한다 (assets/js/program.js).
# 값을 넣으면 카카오 SDK 가 로드되어 진짜 공유창이 뜬다.
#   1) 카카오 개발자센터에서 앱 생성 → JavaScript 키 복사
#   2) 플랫폼 > Web 에 https://adk24211.github.io 등록
#   3) 아래에 키를 넣고 _layouts/program.html 의 integrity 값도 함께 채울 것
kakao_js_key: ""
