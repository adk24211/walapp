title: Walapp
description: 국내 정책·청년 정책·생활 통계부터 흥미로운 발견까지, 공공·1차 자료를 토대로 매일 아침 핵심만 쉽게 정리해 전하는 브리핑입니다.
baseurl: "/walapp"
url: "https://adk24211.github.io"
lang: ko

# ---- 발행 시점 ----
# 당일 07시(KST) 포스트가 빌드 시점에 '미래'로 간주돼 누락되는 것을 방지한다.
# (날짜 표시는 워크플로우 빌드 스텝의 TZ=Asia/Seoul 로 KST로 렌더된다)
future: true

# ---- SEO / 소셜 ----
author: Walapp
twitter:
  card: summary_large_image
social:
  name: Walapp
  links: []
logo: /assets/images/logo.png
image: /assets/images/logo-full.png

# 모든 페이지 기본 공유 이미지(og:image/twitter:image) — jekyll-seo-tag가 page.image로 사용
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/logo-full.png

# Google Search Console 사이트 소유 인증 (HTML 태그 방식의 content 값).
google_site_verification: "5IRKXouoxlQsJLyugZIoOCw7sXlWB-mYV9Trnlm88a4"

# Google Analytics(GA4) 측정 ID. 값을 넣으면 추적 스크립트 자동 삽입.
google_analytics: "G-NS58PGSBFP"

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

categories_label:
  policy: "국내 정책"
  youth: "청년 정책"
  data: "통계·생활정보"
  curious: "흥미로운 발견"

exclude:
  - scripts/
  - requirements.txt
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
  - HANDOFF.md

paginate: 10
paginate_path: "/page/:num/"

feed:
  posts_limit: 20
